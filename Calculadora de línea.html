<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora de línea</title>
<style>
:root{--bg:#eef1f5;--surface:#fff;--ink:#14202e;--muted:#566474;--line:#d3dae3;--accent:#0b5c8a;--on-accent:#fff;--soft:#e2eef6;--bad:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e151d;--surface:#16202b;--ink:#e6ecf2;--muted:#9aa8b6;--line:#2a3846;--accent:#58aee0;--on-accent:#06202f;--soft:#1b2f3f;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e151d;--surface:#16202b;--ink:#e6ecf2;--muted:#9aa8b6;--line:#2a3846;--accent:#58aee0;--on-accent:#06202f;--soft:#1b2f3f;--bad:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.mono,.big{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
main{max-width:640px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:1.7rem;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 24px}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:20px}
h2{font-size:1.1rem;margin:0 0 14px}
.fila{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted);flex:1 1 200px}
input{font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.05rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-width:0;width:100%}
button{font:inherit;font-weight:600;border-radius:6px;padding:9px 20px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);margin:12px 0 0}
.final{margin-top:16px;padding:18px;border-radius:8px;background:var(--soft);display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.final span{color:var(--muted)}
.big{font-size:2.6rem;font-weight:700;letter-spacing:.02em;color:var(--accent)}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:.9rem;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.r{font-weight:700;color:var(--accent)}
@media (max-width:560px){.big{font-size:2.1rem}button{flex:1 1 100%}}
</style>
</head>
<body>
<main>
  <h1>Calculadora de línea</h1>
  <p class="sub">Escribe un dato y obtén su línea.</p>

  <section aria-labelledby="t1">
    <h2 id="t1">Calcular un dato</h2>
    <form id="f" class="fila" autocomplete="off">
      <label>Dato<input id="dato" inputmode="numeric" placeholder="Ej. 15838" aria-describedby="msg"></label>
      <button type="submit">Calcular</button>
    </form>
    <p class="err" id="msg" role="alert" hidden></p>
    <div id="salida" aria-live="polite"></div>
  </section>

  <section aria-labelledby="t2">
    <h2 id="t2">Resultados por fecha</h2>
    <table>
      <thead><tr><th>Fecha</th><th>Resultado</th></tr></thead>
      <tbody id="cuerpo"></tbody>
    </table>
  </section>
</main>

<script>
// Datos internos (fecha, dato): no se muestran en pantalla.
const DATOS = [
  ["24-10-2025","164648"],["27-10-2025","325936"],["28-10-2025","32513"],
  ["29-10-2025","319530"],["30-10-2025","803035"],["31-10-2025","91503"],
  ["01-11-2025","825424"],["02-11-2025","161521"],["03-11-2025","169020"],
  ["04-11-2025","884191"],["05-11-2025","201228"]
];

//LOGIC_START
const DIVISOR = 123n;
const volteo = s => [...s].reverse().join('');
const dos = n => String(n).padStart(2, '0');

// Aritmética exacta con BigInt: división larga, truncada (nunca redondeada).
function procesar(texto) {
  const s = String(texto).trim();
  if (!/^\d{2,}$/.test(s)) return { error: 'Ingresa un número de al menos 2 dígitos.' };
  const n = BigInt(s);
  const entero = (n / DIVISOR).toString();
  let resto = n % DIVISOR, dec = '';
  for (let i = 0; i < 10; i++) { resto *= 10n; dec += (resto / DIVISOR).toString(); resto %= DIVISOR; }
  const ocho = (entero + dec).slice(0, 8);
  const par = [ocho.slice(0, 2), ocho.slice(2, 4)];
  const fin = par.map(volteo).map(p => dos(Number(p) + Number(s[1])));
  return { ocho, fin };
}
//LOGIC_END

const $ = id => document.getElementById(id);

$('cuerpo').innerHTML = DATOS.map(([f, d]) => {
  const r = procesar(d);
  return `<tr><td class="mono">${f}</td><td class="mono r">${r.fin[0]} - ${r.fin[1]}</td></tr>`;
}).join('');

$('f').addEventListener('submit', e => {
  e.preventDefault();
  const r = procesar($('dato').value);
  $('msg').hidden = !r.error;
  $('msg').textContent = r.error || '';
  $('salida').innerHTML = r.error ? '' :
    `<div class="final"><span>Resultado</span><span class="big">${r.fin[0]} - ${r.fin[1]}</span></div>`;
});
</script>
</body>
</html>
